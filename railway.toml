# Railway config-as-code (single-host Docker deploy).
#
# Validated against Railway's official schema (railway.schema.json):
#   - [build] dockerfilePath  -> tells Railpack/Nixpacks to use our Dockerfile
#   - [deploy] healthcheckPath + healthcheckTimeout -> verified schema keys
#
# NOTE: the previous railway.json used TOML syntax under a .json extension,
# which Railway could not JSON-parse (build never started). This is the same
# config as proper TOML.

[build]
dockerfilePath = "./Dockerfile"

[deploy]
# /api/health returns {"ok": true, ...} once the vector store + engine are loaded.
healthcheckPath = "/api/health"
# First boot loads ChromaDB + the embedding model (~30-45s). Give it room.
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
